[package]
name = "nebula"
version = "0.3.0"
description = "Nebula Photo Manager"
authors = ["Diego Hernández Herrera <diegohh0411@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nebula_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
log = { version = "0.4.29", features = ["std"] }
env_filter = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
notify = "6"
num_cpus = "1.16"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = "0.3"
sha2 = "0.10"
blake3 = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
dirs = "5"
anyhow = "1"
once_cell = "1"
sqlite-vec = "0.1"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
face_id = "0.4.1"
hf-hub = "0.5"
ndarray = "0.17"
half = "2"
ort = "2.0.0-rc.12"
tokenizers = "0.21"

# DirectML is Windows-only; Linux builds fall back to the CPU EP.
[target.'cfg(windows)'.dependencies]
face_id = { version = "0.4.1", features = ["directml"] }
ort = { version = "2.0.0-rc.12", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["coreml"] }
