name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write          # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22      # keep in sync with pr-build-windows.yml
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Download VC++ 2015-2022 redistributable (x64)
        shell: pwsh
        run: |
          $dest = "src-tauri/redist/vc_redist.x64.exe"
          New-Item -ItemType Directory -Force -Path src-tauri/redist | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $dest
          if (-not (Test-Path $dest)) { throw "vc_redist download failed: $dest missing" }
          $f = Get-Item $dest
          Write-Host "Downloaded $($f.FullName) ($([math]::Round($f.Length/1MB,1)) MB)"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nebula ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # NSIS only: it runs vc_redist via an installer hook (see
          # src-tauri/nsis/hooks.nsh). MSI would not, so we don't ship it.
          args: --bundles nsis --config src-tauri/tauri.ci.conf.json

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write          # upload bundles to the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Apple Silicon only: ort (ONNX Runtime bindings) dropped prebuilt
          # binaries for x86_64-apple-darwin in 2.0.0-rc.11, so a universal
          # binary can no longer be built without vendoring ONNX Runtime.
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nebula ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # No tauri.ci.conf.json here: it only adds the Windows vc_redist
          # resource, which doesn't exist (and isn't needed) on macOS.
          args: --target aarch64-apple-darwin --bundles app,dmg
