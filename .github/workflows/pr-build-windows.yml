name: PR Build Windows

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22      # keep in sync with release-windows.yml
          cache: pnpm
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Download VC++ 2015-2022 redistributable (x64)
        shell: pwsh
        run: |
          $dest = "src-tauri/redist/vc_redist.x64.exe"
          New-Item -ItemType Directory -Force -Path src-tauri/redist | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $dest
          if (-not (Test-Path $dest)) { throw "vc_redist download failed: $dest missing" }
          $f = Get-Item $dest
          Write-Host "Downloaded $($f.FullName) ($([math]::Round($f.Length/1MB,1)) MB)"
          Get-ChildItem src-tauri/redist -Force | Format-Table Name, Length, FullName
      - name: Verify redist present before build
        shell: pwsh
        run: |
          Write-Host "cwd: $(Get-Location)"
          Get-ChildItem src-tauri/redist -Force | Format-Table Name, Length, FullName
          if (-not (Test-Path "src-tauri/redist/vc_redist.x64.exe")) { throw "redist missing immediately before build" }
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          # NSIS only: it runs vc_redist via an installer hook (see
          # src-tauri/nsis/hooks.nsh). MSI would not, so we don't ship it.
          args: --debug --bundles nsis
        # no tagName → build only, no release created
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-windows-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
