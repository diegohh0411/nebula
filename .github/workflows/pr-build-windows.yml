name: PR Build Windows

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22      # keep in sync with release-windows.yml
          cache: pnpm
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Download VC++ 2015-2022 redistributable (x64)
        shell: pwsh
        run: |
          $dest = "src-tauri/redist/vc_redist.x64.exe"
          New-Item -ItemType Directory -Force -Path src-tauri/redist | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $dest
          if (-not (Test-Path $dest)) { throw "vc_redist download failed: $dest missing" }
          $f = Get-Item $dest
          Write-Host "Downloaded $($f.FullName) ($([math]::Round($f.Length/1MB,1)) MB)"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          # NSIS only: it runs vc_redist via an installer hook (see
          # src-tauri/nsis/hooks.nsh). MSI would not, so we don't ship it.
          args: --debug --bundles nsis
        # no tagName → build only, no release created
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-windows-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

  # Acceptance test for TT-33 on a genuinely *fresh* Windows machine. GitHub
  # runners are saturated with VC++-dependent software and keep the CRT DLLs
  # loaded, so they can't be made clean. We instead use a pristine Windows
  # container (servercore) that ships with no VC++ runtime at all, and prove:
  # on the clean machine the app aborts with STATUS_DLL_NOT_FOUND; after our
  # installer runs, its POSTINSTALL hook has installed the exact VC++ runtime
  # the bug names (MSVCP140_1.dll & co). See the script for details.
  verify-clean-install:
    needs: build-windows
    runs-on: windows-2022   # pin so servercore:ltsc2022 matches the host kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nebula-windows-${{ github.sha }}
          path: artifact
      - name: Assemble test payload
        shell: pwsh
        run: |
          $setup = (Get-ChildItem -Path artifact -Recurse -Filter '*setup.exe' | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path test\bare | Out-Null
          Copy-Item $setup test\setup.exe
          & 7z e "$setup" nebula.exe -otest\bare -y | Out-Null
          Copy-Item .github\scripts\tt33-clean-install-test.ps1 test\run.ps1
      - name: Install + launch in a pristine Windows container
        shell: pwsh
        run: |
          docker run --rm -v "${{ github.workspace }}\test:C:\test" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:\test\run.ps1
