name: PR Build Windows

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22      # keep in sync with release-windows.yml
          cache: pnpm
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Download VC++ 2015-2022 redistributable (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "src-tauri/redist/vc_redist.x64.exe"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          # NSIS only: it runs vc_redist via an installer hook (see
          # src-tauri/nsis/hooks.nsh). MSI would not, so we don't ship it.
          args: --debug --bundles nsis
        # no tagName → build only, no release created
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-windows-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
