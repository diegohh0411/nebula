<div
  class="person-card group"
  role="button"
  tabindex="0"
  (click)="navigate()"
  (keydown.enter)="navigate()"
  (keydown.space)="navigate()"
>
  @if (cropUrl(); as url) {
    <img [src]="url" [alt]="name() ?? 'Unnamed'" loading="lazy" decoding="async" class="person-card-img" />
  } @else {
    <span class="person-card-placeholder">👤</span>
  }

  <div class="person-card-scrim"></div>

  <div class="person-card-meta">
    @if (match().tags.length > 0) {
      <div class="person-card-tags">
        @for (tag of match().tags.slice(0, 2); track tag.id) {
          <span class="person-card-tag">{{ tag.name }}</span>
        }
        @if (match().tags.length > 2) {
          <span class="person-card-tag">+{{ match().tags.length - 2 }}</span>
        }
      </div>
    }
    <div (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <app-editable-text
        [value]="name()"
        placeholder="Unnamed"
        placeholderClass="opacity-70"
        displayClass="person-card-name"
        (commit)="saveName($event)"
      />
    </div>
  </div>

  @if (removable()) {
    <span class="person-card-remove" role="button" tabindex="0" (click)="onRemove($event)" (keydown.enter)="onRemove($event)" (keydown.space)="onRemove($event)">Remove</span>
  }
</div>

<app-confirm-merge-dialog
  [open]="showNameConflict()"
  (merge)="confirmMerge()"
  (cancel)="cancelMerge()"
/>
