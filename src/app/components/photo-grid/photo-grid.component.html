<div class="photo-grid">
  @for (img of images; track imageId(img)) {
    <div class="photo-cell group" [title]="filename(img)">
      @if (thumbUrl(img)) {
        <img
          class="photo-thumb"
          [src]="thumbUrl(img)!"
          [alt]="filename(img)"
          loading="lazy"
          decoding="async"
        />
      } @else {
        <!-- Placeholder when thumbnail not yet generated -->
        <div class="photo-placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="photo-placeholder-icon">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
      }

      <!-- Embed status dot — visible on hover -->
      <span
        class="status-dot"
        [class.status-dot--done]="embedStatus(img) === 'done'"
        [class.status-dot--pending]="embedStatus(img) === 'pending'"
        [class.status-dot--failed]="embedStatus(img) === 'failed'"
        [title]="embedStatus(img)"
      ></span>
    </div>
  }
</div>
