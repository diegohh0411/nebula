<div class="photo-grid" [style.height.px]="rowHeight">
  @for (img of images; track imageId(img)) {
    <div
      class="photo-cell group"
      [title]="filename(img)"
      [style.flex-grow]="0.8 + ((imageId(img) * 54321) % 1000) / 1000"
      (click)="onPhotoClick(img)"
      [attr.data-id]="imageId(img)"
      [class.selected]="photos.selectedImageIds().has(imageId(img))"
    >
      @if (thumbUrl(img)) {
        <img
          class="photo-thumb"
          [src]="thumbUrl(img)!"
          [alt]="filename(img)"
          loading="lazy"
          decoding="async"
          [style.view-transition-name]="(photos.transitioningImageId() === imageId(img) && !photos.selectedImage()) ? 'photo-' + imageId(img) : 'none'"
        />
      } @else {
        <!-- Placeholder when thumbnail not yet generated -->
        <div class="photo-placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="photo-placeholder-icon">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
      }

      <!-- Similarity Score Badge -->
      @if (hasScore(img)) {
        <div class="similarity-badge">
          {{ Math.round(getScore(img) * 100) }}%
        </div>
      }

      <!-- Processing stage dot — visible on hover -->
      <span
        class="status-dot"
        [class.status-dot--pending]="processingStage(img) === 'pending'"
        [class.status-dot--ready]="processingStage(img) === 'ready'"
        [class.animate-pulse]="processingStage(img) !== 'ready'"
        [title]="processingStage(img) === 'pending' ? 'Analyzing, come back soon' : 'Ready'"
      ></span>
    </div>
  }
</div>
